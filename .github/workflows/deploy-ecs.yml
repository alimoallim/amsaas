name: Deploy to ECS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag
        required: false
        default: latest
      run_migrations:
        description: Run database migrations after deploy
        required: false
        default: false
        type: boolean
concurrency:
  group: deploy-ecs-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'amsaas-repo' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'amsaas-prod' }}
  ECS_SERVICE_WEB: ${{ vars.ECS_SERVICE_WEB || 'amsaas-web' }}
  ECS_SERVICE_WORKER: ${{ vars.ECS_SERVICE_WORKER || 'amsaas-worker' }}

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
        run: |
          docker build \
            -f deploy/docker/Dockerfile \
            -t "${IMAGE_URI}" \
            --build-arg VITE_API_BASE_URL=/api/v1 \
            .
          docker push "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Register ECS task definitions
        env:
          IMAGE_URI: ${{ env.IMAGE_URI }}
          ECS_EXECUTION_ROLE_ARN: ${{ vars.ECS_EXECUTION_ROLE_ARN }}
          ECS_TASK_ROLE_ARN: ${{ vars.ECS_TASK_ROLE_ARN }}
          SSM_PREFIX: ${{ vars.SSM_PREFIX }}
        run: |
          export IMAGE_URI ECS_EXECUTION_ROLE_ARN ECS_TASK_ROLE_ARN AWS_REGION SSM_PREFIX
          envsubst < deploy/ecs/task-definition.web.json.tpl > /tmp/web.json
          envsubst < deploy/ecs/task-definition.worker.json.tpl > /tmp/worker.json
          WEB_ARN=$(aws ecs register-task-definition --cli-input-json file:///tmp/web.json --query 'taskDefinition.taskDefinitionArn' --output text)
          WORKER_ARN=$(aws ecs register-task-definition --cli-input-json file:///tmp/worker.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "WEB_TASK_ARN=${WEB_ARN}" >> "$GITHUB_ENV"
          echo "WORKER_TASK_ARN=${WORKER_ARN}" >> "$GITHUB_ENV"

      - name: Deploy web service
        run: |
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE_WEB}" \
            --task-definition "${WEB_TASK_ARN}" \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE_WEB}"

      - name: Deploy worker service
        if: env.ECS_SERVICE_WORKER != ''
        run: |
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE_WORKER}" \
            --task-definition "${WORKER_TASK_ARN}" \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE_WORKER}"

      - name: Run migrations (optional)
        if: github.event_name == 'workflow_dispatch' && inputs.run_migrations == true
        env:
          ECS_SUBNETS: ${{ vars.ECS_SUBNETS }}
          ECS_SECURITY_GROUPS: ${{ vars.ECS_SECURITY_GROUPS }}
        run: |
          IFS=',' read -ra SUBNET_ARRAY <<< "${ECS_SUBNETS}"
          SUBNET_JSON=$(printf '"%s",' "${SUBNET_ARRAY[@]}" | sed 's/,$//')
          IFS=',' read -ra SG_ARRAY <<< "${ECS_SECURITY_GROUPS}"
          SG_JSON=$(printf '"%s",' "${SG_ARRAY[@]}" | sed 's/,$//')
          NETWORK_CONFIG="{\"awsvpcConfiguration\":{\"subnets\":[${SUBNET_JSON}],\"securityGroups\":[${SG_JSON}],\"assignPublicIp\":\"DISABLED\"}}"
          TASK_ARN=$(aws ecs run-task \
            --cluster "${ECS_CLUSTER}" \
            --task-definition "${WEB_TASK_ARN}" \
            --launch-type FARGATE \
            --network-configuration "${NETWORK_CONFIG}" \
            --overrides '{"containerOverrides":[{"name":"amsaas-web","command":["migrate"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "${ECS_CLUSTER}" --tasks "${TASK_ARN}"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "${ECS_CLUSTER}" --tasks "${TASK_ARN}" --query 'tasks[0].containers[0].exitCode' --output text)
          test "${EXIT_CODE}" = "0"
